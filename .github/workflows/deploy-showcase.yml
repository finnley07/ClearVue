name: Deploy Showcase to GitHub Pages

on:
  push:
    branches:
      - main # trigger on every push to main
  workflow_dispatch: # allow manual runs from the Actions tab

# Allow the workflow to write to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clearvue/package-lock.json

      - name: Install dependencies
        working-directory: clearvue
        run: npm ci

      # GitHub Pages project sites live at /<repo-name>/
      # Pass it as the Vite base URL so all asset paths are correct.
      - name: Build
        working-directory: clearvue
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:showcase

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: clearvue/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
